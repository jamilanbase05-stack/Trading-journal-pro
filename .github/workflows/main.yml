name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web folder
        run: |
          mkdir -p www
          for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          ls -la www
          test -f www/index.html
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: trading-journal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
